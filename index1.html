<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Elite Dashboard | RebirthKey</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/ethers@5.7.2/dist/ethers.umd.min.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;800&family=Orbitron:wght@500;700;900&display=swap" rel="stylesheet">
    
    <style>
        :root { --gold: #ffd700; --bg-dark: #060a08; }
        body { 
            font-family: 'Plus Jakarta Sans', sans-serif; 
            background: var(--bg-dark); color: white; 
            background-image: radial-gradient(circle at 50% 0%, #1a2e23, #060a08 80%);
        }
        .orbitron { font-family: 'Orbitron', sans-serif; }
        
        /* New Elite Card Design */
        .package-card {
            background: linear-gradient(180deg, rgba(255,215,0,0.05) 0%, rgba(0,0,0,1) 100%);
            border: 1px solid rgba(255, 215, 0, 0.3);
            border-radius: 24px;
            padding: 30px 20px;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            text-align: center;
            position: relative;
            overflow: hidden;
        }
        .package-card.active-card {
            border: 1px solid var(--gold);
            box-shadow: 0 0 25px rgba(255, 215, 0, 0.15);
        }
        .package-card::before {
            content: ''; position: absolute; top: 0; left: -100%; width: 100%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,215,0,0.1), transparent);
            transition: 0.5s;
        }
        .package-card:hover::before { left: 100%; }

        .price-text {
            font-size: 2.5rem; font-weight: 900; color: white;
            text-shadow: 0 0 15px rgba(255,255,255,0.2);
            margin-bottom: 1.5rem;
        }

        .btn-buy {
            background: linear-gradient(135deg, #ffd700, #b8860b);
            color: black; font-weight: 900; border-radius: 12px;
            text-transform: uppercase; width: 100%; padding: 12px;
            box-shadow: 0 4px 15px rgba(218, 165, 32, 0.3);
            transition: 0.3s; margin-bottom: 20px;
        }
        .btn-rebuy {
            background: transparent; border: 1.5px solid var(--gold);
            color: var(--gold); font-weight: 900; border-radius: 12px;
            text-transform: uppercase; width: 100%; padding: 12px;
            transition: 0.3s; margin-bottom: 20px;
        }
        .btn-rebuy:hover { background: var(--gold); color: black; }

        .info-line {
            display: flex; justify-content: space-between;
            padding: 8px 0; border-top: 1px solid rgba(255,215,0,0.1);
            font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 1px;
        }

        .status-tag-active { color: #22c55e; text-shadow: 0 0 8px rgba(34,197,94,0.4); }
        .status-tag-pending { color: #ef4444; }
    </style>
</head>
<body class="pb-20">

    <script src="components.js"></script>

    <main class="max-w-7xl mx-auto px-4 pt-10">
        <div class="grid grid-cols-1 lg:grid-cols-3 gap-6 mb-10">
            <div class="lg:col-span-2 gold-border-fixed p-6 flex flex-wrap items-center justify-between gap-6" style="background:#000; border-radius:20px; border:1px solid #ffd700;">
                <div class="flex items-center gap-5">
                    <div class="w-16 h-16 rounded-2xl bg-yellow-500/10 border border-yellow-500 flex items-center justify-center">
                        <i data-lucide="shield-check" class="text-yellow-500 w-8 h-8"></i>
                    </div>
                    <div>
                        <h2 id="wallet-address-display" class="text-xl font-black orbitron text-white">Connecting...</h2>
                        <div class="flex gap-4 mt-1">
                            <span id="user-id-display" class="text-xs font-bold text-yellow-500 orbitron tracking-widest">ID: #---</span>
                            <span class="text-[10px] text-gray-400 font-bold uppercase">Rank: <span id="header-rank" class="text-yellow-500">None</span></span>
                        </div>
                    </div>
                </div>
                <div class="text-center bg-yellow-500/5 px-6 py-2 rounded-xl border border-yellow-500/30">
                    <p class="text-[9px] text-gray-500 uppercase font-black">Direct Partners</p>
                    <p id="direct-count" class="text-2xl font-black orbitron">0</p>
                </div>
            </div>
            <div class="gold-border-fixed p-6 flex flex-col justify-center" style="background:#000; border-radius:20px; border:1px solid #ffd700;">
                <p class="text-[10px] text-yellow-500 font-black uppercase mb-3 text-center tracking-widest">Your Referral Link</p>
                <div class="flex items-center gap-2 bg-white/5 p-2 rounded-lg border border-yellow-500/30">
                    <input id="refURL" type="text" readonly value="Syncing..." class="bg-transparent border-none outline-none w-full text-[10px] text-gray-400 font-mono">
                    <button onclick="copyLink()" class="text-yellow-500 hover:scale-110 transition"><i data-lucide="copy" class="w-4 h-4"></i></button>
                </div>
            </div>
        </div>

        <h3 class="orbitron font-black text-2xl text-white mb-8 border-l-4 border-yellow-500 pl-4">SELECT <span class="text-yellow-500">PACKAGE</span></h3>
        <div id="package-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6">
            </div>
    </main>

    <script src="web3-handler.js"></script>
    <script>
        lucide.createIcons();

        const packageData = [
            { id: 0, rank: "G0", price: 5 }, { id: 1, rank: "G1", price: 44 }, 
            { id: 2, rank: "G2", price: 65 }, { id: 3, rank: "G3", price: 106 }, 
            { id: 4, rank: "G4", price: 187 }, { id: 5, rank: "G5", price: 348 }, 
            { id: 6, rank: "G6", price: 669 }, { id: 7, rank: "G7", price: 1310 }, 
            { id: 8, rank: "G8", price: 2591 }, { id: 9, rank: "G9", price: 5152 }, 
            { id: 10, rank: "G10", price: 10273 }, { id: 11, rank: "G11", price: 20514 }
        ];

        async function renderPackages(activeLevelFromBlockchain = -1) {
            const container = document.getElementById('package-grid');
            if(!container) return;

            container.innerHTML = packageData.map(pkg => {
                // Agar blockchain se aaya level pkg.id se bada ya barabar hai
                const isActive = activeLevelFromBlockchain >= pkg.id;
                
                return `
                <div class="package-card ${isActive ? 'active-card' : ''}">
                    <div class="price-text orbitron">$${pkg.price}</div>

                    ${isActive ? 
                        `<button onclick="handleBuyPackage(${pkg.id})" class="btn-rebuy orbitron">Rebuy Package</button>` : 
                        `<button onclick="handleBuyPackage(${pkg.id})" class="btn-buy orbitron">Buy Now</button>`
                    }

                    <div class="info-line">
                        <span class="text-gray-500">Package Name</span>
                        <span class="text-white orbitron">${pkg.rank}</span>
                    </div>

                    <div class="info-line">
                        <span class="text-gray-500">Status</span>
                        <span class="${isActive ? 'status-tag-active' : 'status-tag-pending'}">
                            ${isActive ? 'Active' : 'Inactive'}
                        </span>
                    </div>
                </div>
                `;
            }).join('');
            lucide.createIcons();
        }

        // --- DATA SYNC FIX ---
        let lastSyncLevel = -99;

        function syncDashboard() {
            // Check window.userData (Jo web3-handler.js se aata hai)
            if (window.userData) {
                // Agar variable name currentPackageId hai
                const currentLevel = parseInt(window.userData.currentPackageId);
                
                if (!isNaN(currentLevel) && currentLevel !== lastSyncLevel) {
                    lastSyncLevel = currentLevel;
                    renderPackages(currentLevel);
                    
                    // Update Header Rank
                    const hRank = document.getElementById('header-rank');
                    if(hRank) hRank.innerText = "G" + currentLevel;
                    
                    console.log("Data Received! Current Level:", currentLevel);
                }
            }
        }

        window.addEventListener('load', () => {
            renderPackages(-1); // Default view
            setInterval(syncDashboard, 1000); // Har second check karega
        });

        function copyLink() {
            const refInput = document.getElementById('refURL');
            if (refInput.value.includes("Syncing") || !refInput.value) return;
            refInput.select();
            navigator.clipboard.writeText(refInput.value);
            alert("Referral link copied!");
        }
    </script>
</body>
</html>
